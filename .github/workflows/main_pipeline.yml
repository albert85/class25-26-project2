name: CIS Hardening & FastAPI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security_scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with: { languages: 'python' }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Scan Dependencies (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'

  deploy_ansible:
    needs: security_scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      
      - name: Cache Ansible Roles
        uses: actions/cache@v3
        with:
          path: ~/.ansible/roles
          key: ${{ runner.os }}-ansible-roles-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible & Dependencies
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy install -r requirements.yml
      
      - name: Run Ansible Playbook
        run: |
          # Create secrets
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > id_rsa
          chmod 600 id_rsa
          
          # Run playbook
          ansible-playbook -i inventories/staging/hosts.ini site.yml \
            --vault-password-file .vault_pass \
            --private-key id_rsa \
            -u ec2-user \
            --extra-vars "BASTION_PUBLIC_IP=${{ secrets.BASTION_IP }} APP_PRIVATE_IP=${{ secrets.APP_SERVERS_IP }}"

      - name: Verify Deployment (Smoke Test)
        run: |
          echo "Waiting for Nginx on Bastion to respond..."
          # Use a loop to wait up to 60 seconds instead of a hard 'sleep 15'
          timeout 60s bash -c 'until curl -s --head http://${{ secrets.BASTION_IP }} | grep "200 OK"; do sleep 5; done'

      - name: Cleanup Secrets
        if: always() # This runs even if the deployment fails!
        run: |
          rm -f .vault_pass id_rsa
          echo "Sensitive files removed."