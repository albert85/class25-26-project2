[defaults]
# 1. Search Path: Look in your local repo folder FIRST, then the Galaxy download folder
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
host_key_checking = False
inventory = ./inventories/staging/hosts.ini
vault_password_file = .vault_pass
stdout_callback = yaml
bin_ansible_callbacks = True

# 2. Performance: Only gather facts once and cache them
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# 3. Performance: Reduce SSH handshake overhead
# NOTE: If you get "sudo: a terminal is required", set pipelining = False
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o PreferredAuthentications=publickey