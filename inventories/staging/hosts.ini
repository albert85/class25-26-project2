[bastion]
# We use the environment variable directly or pass it via extra-vars
bastion ansible_host="{{ BASTION_IP }}"

[app_servers]
app_node ansible_host="{{ APP_IP }}"

[app_servers:vars]
# ProxyJump is a cleaner way to handle jump hosts than ProxyCommand
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyJump=ec2-user@{{ BASTION_IP }}'

[all:vars]
ansible_user=ec2-user
