---
# 1. Package Installation
- name: Install security-essential and python packages
  ansible.builtin.dnf:
    name: 
      - python3
      - python3-pip
      - python3-devel
    state: present
    update_cache: yes
  become: yes

# 4. Direct Code Sync
- name: Sync data with rsync
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/"
    dest: /home/ec2-user/class25-26-project2/
    use_ssh_args: yes
  vars:
    ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=60"

# --- FIX START ---
- name: Allow systemd to traverse the home directory
  ansible.builtin.file:
    path: /home/ec2-user
    mode: '0755'  # Adds the +x bit so systemd can enter the folder
  become: yes

- name: Fix project directory ownership and execution bits
  ansible.builtin.file:
    path: "/home/ec2-user/class25-26-project2/"
    owner: ec2-user
    group: ec2-user
    mode: '0755'  # Ensures the folder is accessible
    state: directory
    recurse: yes
  become: yes
# --- FIX END ---

# 5. Virtual Environment & Dependencies
- name: Setup .venv and install requirements
  ansible.builtin.pip:
    requirements: "/home/ec2-user/class25-26-project2/requirements.txt"
    virtualenv: "/home/ec2-user/class25-26-project2/.venv"
    virtualenv_command: python3 -m venv
  become: yes
  become_user: ec2-user

# 6. Service & Nginx Deployment
- name: Deploy FastAPI systemd service
  ansible.builtin.template:
    src: project.service.j2
    dest: /etc/systemd/system/fastapi.service
    mode: '0644'
  become: yes # Crucial: only root can write to /etc/systemd/system/
  notify: Restart FastAPI

# 7. Final Service Activation
- name: Force systemd to reload configs
  ansible.builtin.systemd:
    daemon_reload: yes
  become: yes

- name: Ensure FastAPI is running
  ansible.builtin.service:
    name: fastapi
    state: started
    enabled: yes
  become: yes