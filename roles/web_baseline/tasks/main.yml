---
- name: Install security-essential packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, chrony, unattended-upgrades]
    state: present
    update_cache: yes

- name: Configure UFW Firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['22', '80', '443']

- name: Enable Firewall
  community.general.ufw:
    state: enabled
    policy: deny

- name: Ensure AWS Time Sync is configured (CIS/AWS Best Practice)
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    line: "server 169.254.169.123 prefer iburst"
    state: present
  notify: restart_chrony

- name: Ensure automatic security updates are enabled
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";