# 4. Move Code from /tmp to Home
- name: Ensure project directory exists in home
  ansible.builtin.file:
    path: /home/ec2-user/class25-26-project2
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Sync data from /tmp to home
  ansible.builtin.copy:
    src: /tmp/project/
    dest: /home/ec2-user/class25-26-project2/
    remote_src: yes
    owner: ec2-user
    group: ec2-user

# --- FIX START ---
- name: Allow systemd to traverse the home directory
  ansible.builtin.file:
    path: /home/ec2-user
    mode: '0755'  # Adds the +x bit so systemd can enter the folder
  become: yes

- name: Fix project directory ownership and execution bits
  ansible.builtin.file:
    path: "/home/ec2-user/class25-26-project2/"
    owner: ec2-user
    group: ec2-user
    mode: '0755'  # Ensures the folder is accessible
    state: directory
    recurse: yes
  become: yes
# --- FIX END ---



# 5. Virtual Environment & Dependencies
# - name: Setup .venv and install requirements
#   ansible.builtin.pip:
#     requirements: "/home/ec2-user/class25-26-project2/requirements.txt"
#     virtualenv: "/home/ec2-user/class25-26-project2/.venv"
#     virtualenv_command: python3 -m venv
#   become: yes
#   become_user: ec2-user

# 5. Virtual Environment & Dependencies (Offline)
- name: Setup .venv and install requirements offline
  ansible.builtin.pip:
    requirements: "/home/ec2-user/class25-26-project2/requirements.txt"
    virtualenv: "/home/ec2-user/class25-26-project2/.venv"
    # --no-index and --find-links force pip to stay offline
    extra_args: "--no-index --find-links=/tmp/offline-packages/python-wheels"
  become: yes
  become_user: ec2-user

# 6. Service & Nginx Deployment
- name: Deploy FastAPI systemd service
  ansible.builtin.template:
    src: project.service.j2
    dest: /etc/systemd/system/fastapi.service
    mode: '0644'
  become: yes # Crucial: only root can write to /etc/systemd/system/
  notify: Restart FastAPI

- name: Fix SELinux context for hardened instance
  ansible.builtin.shell: chcon -t bin_t -R /home/ec2-user/class25-26-project2/
  become: yes

- name: Ensure uvicorn/python is executable
  ansible.builtin.file:
    path: /home/ec2-user/class25-26-project2/.venv/bin/python
    mode: '0755'
  become: yes

# 7. Final Service Activation
- name: Force systemd to reload configs
  ansible.builtin.systemd:
    daemon_reload: yes
  become: yes

- name: Ensure FastAPI is running
  ansible.builtin.service:
    name: fastapi
    state: started
    enabled: yes
  become: yes