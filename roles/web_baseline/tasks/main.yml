---
# 1. Install System Packages (Using DNF for Amazon Linux/ec2-user)
- name: Install security-essential and python packages
  ansible.builtin.dnf:
    name: [ufw, fail2ban, chrony, python3-pip, python3-devel, nginx]
    state: present
    update_cache: yes

# 2. Configure UFW Firewall
- name: Configure UFW Firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['22', '80', '443']

- name: Enable Firewall
  community.general.ufw:
    state: enabled
    policy: deny

# 3. AWS Time Sync & Security Updates
- name: Ensure AWS Time Sync is configured
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    line: "server 169.254.169.123 prefer iburst"
    state: present
  notify: restart_chrony

# 4. Prepare Project Directory & Sync Code
- name: Ensure project directory exists
  ansible.builtin.file:
    path: /home/ec2-user/class25-26-project2
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Sync application code to server
  ansible.builtin.copy:
    src: ./  # Copies your repo content (including requirements.txt)
    dest: /home/ec2-user/class25-26-project2/
    owner: ec2-user
    group: ec2-user

# 5. Virtual Environment Setup
- name: Create Python Virtual Environment and install requirements
  ansible.builtin.pip:
    requirements: "/home/ec2-user/class25-26-project2/requirements.txt"
    virtualenv: "/home/ec2-user/class25-26-project2/.venv"
    virtualenv_command: python3 -m venv
  become: yes
  become_user: ec2-user

# 6. Deploy FastAPI Systemd Service
- name: Copy FastAPI systemd service file
  ansible.builtin.template:
    src: project.service.j2
    dest: /etc/systemd/system/fastapi.service
    mode: '0644'
  notify: Restart FastAPI

# 7. Configure Nginx (Amazon Linux typically uses conf.d instead of sites-available)
- name: Copy Nginx configuration
  ansible.builtin.template:
    src: nginx_fastapi.conf.j2
    dest: /etc/nginx/conf.d/fastapi.conf
    mode: '0644'
  notify: Reload Nginx

# 8. Final Service Management
- name: Ensure FastAPI and Nginx are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop: [fastapi, nginx]