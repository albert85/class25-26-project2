---
# 1. Package Installation
- name: Install security-essential and python packages
  ansible.builtin.dnf:
    name: 
      - chrony
      - firewalld
      - fail2ban
    state: present
    update_cache: yes

# 2. Security Hardening: Firewall
- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: yes

- name: Allow SSH, HTTP, and HTTPS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: yes
    state: enabled
  loop: [ssh, http, https]
  notify: reload_firewall

# 3. Security Hardening: Time Sync (FIXED PATH)
- name: Configure AWS Time Sync
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf  # <--- FIXED: Amazon Linux uses /etc/chrony.conf
    line: "server 169.254.169.123 prefer iburst"
    state: present
  notify: restart_chrony

# 4. Ensure Fail2Ban is running
- name: Create local fail2ban config if missing
  ansible.builtin.copy:
    content: "[DEFAULT]\nignorself = true"
    dest: /etc/fail2ban/jail.local
    force: no

- name: Ensure Fail2Ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes