name: CIS Hardening & FastAPI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security_scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # 1. Secret Scanning
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. SAST (CodeQL)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with: { languages: 'python' }
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # 3. Dependency Scan
      - name: Scan Dependencies (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'

  deploy_ansible:
    needs: security_scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      
      - name: Cache Ansible Roles
        uses: actions/cache@v3
        with:
          path: ~/.ansible/roles
          key: ${{ runner.os }}-ansible-roles-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible & Dependencies
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy install -r requirements.yml

      - name: Run Ansible Playbook (Hardening + Nginx + FastAPI)
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          echo "$VAULT_PASS" > .vault_pass
          echo "$SSH_KEY" > id_rsa && chmod 600 id_rsa
          # StrictHostKeyChecking=no prevents the "untrusted host" prompt from hanging the CI
          ansible-playbook -i inventories/staging/hosts.ini site.yml \
            --vault-password-file .vault_pass \
            --private-key id_rsa \
            -u ubuntu \
            --ssh-common-args='-o StrictHostKeyChecking=no'

      - name: Verify Deployment (Smoke Test)
        run: |
          echo "Waiting for services to start..."
          sleep 10
          # This pings your AWS IP to make sure Nginx is serving the FastAPI app
          curl -s --head http://${{ secrets.INSTANCE_IP }} | grep "200 OK"