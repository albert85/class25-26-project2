---
# Step 1: Connectivity Check
- name: Connectivity Check
  hosts: all
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60


# Step 1: Setup Web Entry Point
- name: Deploy Nginx
  hosts: app_servers
  become: yes
  roles:
    - role: nginx_deploy

# Step 2: Setup Internal App
- name: Deploy FastAPI
  hosts: app_servers
  become: yes
  roles:
    - role: app_deploy

# Step 3: Hardening the Bastion
- name: Hardening Bastion server
  hosts: bastion
  become: yes
  ignore_errors: yes
  
  pre_tasks:
    - name: Ensure DNF configuration directory exists
      ansible.builtin.file:
        path: /etc/dnf
        state: directory
        mode: '0755'

    - name: Pre-configure DNF for CIS compliance
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
        state: present
        mode: '0644'
      loop:
        - { regexp: '^gpgcheck=', line: 'gpgcheck=1' }
        - { regexp: '^localpkg_gpgcheck=', line: 'localpkg_gpgcheck=1' }

  vars:
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    # CIS Logic Fixes
    rhel9cis_section1_patch_management: false  
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false
    rhel9cis_setup_audit: true

  roles:
    - role: os_hardening      
    - role: ssh_hardening     
    - { role: rhel9-cis, ignore_errors: yes }

# Step 4: Hardening the App Server
- name: OS Hardening Application servers
  hosts: app_servers
  become: yes
  ignore_errors: yes
  
  pre_tasks:
    - name: Ensure DNF configuration directory exists
      ansible.builtin.file:
        path: /etc/dnf
        state: directory
        mode: '0755'

    - name: Pre-configure DNF for CIS compliance
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
        state: present
        mode: '0644'
      loop:
        - { regexp: '^gpgcheck=', line: 'gpgcheck=1' }
        - { regexp: '^localpkg_gpgcheck=', line: 'localpkg_gpgcheck=1' }

  vars:
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_section1_patch_management: false
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false

  roles:
    - role: os_hardening
    - role: ssh_hardening
    - { role: rhel9-cis, ignore_errors: yes }
# Step 4: Hardening the App Server
- name: OS Hardening Application servers
  hosts: app_servers
  become: yes
  ignore_errors: yes
  
  pre_tasks:
    - name: Ensure DNF configuration directory exists
      ansible.builtin.file:
        path: /etc/dnf
        state: directory
        mode: '0755'

    - name: Pre-configure DNF for CIS compliance
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
        state: present
        mode: '0644'
      loop:
        - { regexp: '^gpgcheck=', line: 'gpgcheck=1' }
        - { regexp: '^localpkg_gpgcheck=', line: 'localpkg_gpgcheck=1' }

  vars:
    # --- New Variables to fix ALB access ---
    # We use the variable passed from GitHub Secrets
    firewall_allow_sources: ["{{ target_vpc_cidr }}"] 
    # This tells the os_hardening role to whitelist your VPC CIDR
    
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_section1_patch_management: false
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false

  roles:
    - role: os_hardening
    - role: ssh_hardening
    - { role: rhel9-cis, ignore_errors: yes }

  # --- CRITICAL FIX ---
  # These tasks run AFTER the roles to ensure the ALB can still get in
  post_tasks:
    - name: Ensure firewalld trusts the VPC (ALB Health Checks)
      ansible.posix.firewalld:
        source: "{{ target_vpc_cidr }}"
        zone: trusted
        state: enabled
        permanent: yes
        immediate: yes

    - name: Configure Fail2Ban to ignore VPC (ALB IPs)
      ansible.builtin.lineinfile:
        path: /etc/fail2ban/jail.local
        regexp: '^ignoreip ='
        line: "ignoreip = 127.0.0.1/8 {{ target_vpc_cidr }}"
        create: yes
      notify: restart_fail2ban

  handlers:
    - name: restart_fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted