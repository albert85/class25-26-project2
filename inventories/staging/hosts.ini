[bastion]
# Using 'bastion' as both the host name and the group name simplifies things
bastion ansible_host="{{ lookup('env', 'BASTION_IP') }}"

[app_servers]
app_node ansible_host="{{ lookup('env', 'APP_IP') }}"

[app_servers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyJump=ec2-user@{{ hostvars["bastion"]["ansible_host"] }}'

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=./id_rsa