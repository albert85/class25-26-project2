[bastion]
bastion_host ansible_host={{ BASTION_PUBLIC_IP }}

[app_servers]
app_node ansible_host={{ APP_PRIVATE_IP }}

[all:vars]
ansible_user=ec2-user
# 1. Point to the local 'id_rsa' file you created in the workflow
ansible_ssh_private_key_file=./id_rsa

# 2. Add -i ./id_rsa inside the ProxyCommand so the jump host knows which key to use
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ./id_rsa -W %h:%p -q ec2-user@{{ BASTION_PUBLIC_IP }}"'