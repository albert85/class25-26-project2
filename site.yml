---
# Step 1: Connectivity Check
# This ensures the EC2 instances are fully booted and reachable before hardening starts.
- name: Connectivity Check
  hosts: all
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60

# Step 2: Hardening the Bastion
# Note: We use the names defined in your requirements.yml
- name: Hardening Bastion server
  hosts: bastion
  become: yes
  vars:
    # Path fix for Amazon Linux 2023 / RHEL
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    # CIS Benchmark adjustments for Cloud AMIs
    rhel9cis_bootloader_password: false
    rhel9cis_setup_audit: true
    rhel9cis_rule_1_2_3: false  
    rhel9cis_skip_for_manual_configuration: true
  roles:
    - role: os_hardening
    - role: ssh_hardening
    - role: rhel9-cis
      ignore_errors: yes  # Bypass the DNF/YUM "1 replacements made" audit failure

# Step 3: Hardening the App Server
# This connection automatically uses the ProxyCommand jump through the Bastion.
- name: OS Hardening Application servers
  hosts: app_servers
  become: yes
  vars:
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_bootloader_password: false
    rhel9cis_setup_audit: true
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
  roles:
    - role: os_hardening
    - role: ssh_hardening
    - role: rhel9-cis
      ignore_errors: yes

# Step 4: Setup Web Entry Point (Local Role)
- name: Deploy Nginx
  hosts: bastion
  become: yes
  roles:
    - role: nginx_deploy

# Step 5: Setup Internal App (Local Role)
- name: Deploy FastAPI
  hosts: app_servers
  become: yes
  roles:
    - role: app_deploy