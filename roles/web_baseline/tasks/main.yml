---
# 1. Package Installation (DNF for Amazon Linux)
- name: Install security-essential and python packages
  ansible.builtin.dnf:
    name: 
      - nginx
      - python3-pip
      - python3-devel
      - chrony
      - firewalld       # RHEL/Amazon Linux equivalent to UFW
      - fail2ban
    state: present
    update_cache: yes

# 2. Security Hardening: Firewall (Firewalld)
- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: yes

- name: Allow SSH, HTTP, and HTTPS in firewall
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: yes
    state: enabled
  loop: [ssh, http, https]
  notify: reload_firewall

# 3. Security Hardening: Time Sync & Fail2Ban
- name: Ensure AWS Time Sync is configured (CIS Best Practice)
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    line: "server 169.254.169.123 prefer iburst"
    state: present
  notify: restart_chrony

- name: Ensure Fail2Ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes

# 4. Project Directory and Code Sync
- name: Ensure project directory exists
  ansible.builtin.file:
    path: /home/ec2-user/class25-26-project2
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Sync application code to server
  ansible.builtin.copy:
    src: ./ 
    dest: /home/ec2-user/class25-26-project2/
    owner: ec2-user
    group: ec2-user
    exclude: [ '.venv', '__pycache__', '.git' ]

# 5. Virtual Environment & Dependencies
- name: Create Python Virtual Environment and install requirements
  ansible.builtin.pip:
    requirements: "/home/ec2-user/class25-26-project2/requirements.txt"
    virtualenv: "/home/ec2-user/class25-26-project2/.venv"
    virtualenv_command: python3 -m venv
  become: yes
  become_user: ec2-user

# 6. FastAPI Service Deployment
- name: Copy FastAPI systemd service file
  ansible.builtin.template:
    src: project.service.j2
    dest: /etc/systemd/system/fastapi.service
    mode: '0644'
  notify: Restart FastAPI

# 7. Nginx Configuration (RHEL/Amazon Linux Path)
- name: Ensure Nginx conf.d directory exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: '0755'

- name: Copy Nginx configuration to conf.d
  ansible.builtin.template:
    src: nginx_fastapi.conf.j2
    dest: /etc/nginx/conf.d/fastapi.conf
    mode: '0644'
  notify: Reload Nginx

# 8. Service Start and Verification
- name: Ensure FastAPI and Nginx are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop: [fastapi, nginx]