name: CIS Hardening & FastAPI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security_scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with: { languages: 'python' }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Scan Dependencies (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'

  deploy_ansible:
    needs: security_scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # <-- Ensure this matches your AWS region

      - name: Whitelist Runner IP in Bastion Security Group
        id: whitelist
        run: |
          GITHUB_IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=${GITHUB_IP}" >> $GITHUB_OUTPUT
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.BASTION_IP }} \
            --protocol tcp --port 22 --cidr ${GITHUB_IP}/32

      - name: Install Ansible & Dependencies
        run: |
          pip install ansible boto3 botocore
          [ -f requirements.yml ] && ansible-galaxy install -r requirements.yml --force || echo "No requirements.yml found"
      
      - name: Run Ansible Playbook (Jump Host Tunnel)
        env:
          BASTION_IP: ${{ secrets.BASTION_IP }}
        run: |
          # Create temporary credential files
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > id_rsa
          chmod 600 id_rsa
          
          # Execute Ansible
          # We use ProxyCommand to bridge the gap between the Runner -> Bastion -> Private Instance
          ansible-playbook -i inventories/staging/hosts.ini site.yml \
            --vault-password-file .vault_pass \
            --private-key id_rsa \
            -u ec2-user \
            --extra-vars "ansible_ssh_common_args='-o ProxyCommand=\"ssh -i id_rsa -W %h:%p -q -o StrictHostKeyChecking=no ec2-user@${{ secrets.BASTION_IP }}\" -o StrictHostKeyChecking=no' \
                          BASTION_IP=${{ secrets.BASTION_IP }} \
                          server_name=${{ secrets.SERVER_NAME }} \
                          app_servers_IP=${{ secrets.APP_SERVERS_IP }} \
                          APP_IP=${{ secrets.APP_SERVERS_IP }}" \
            --limit 'all:!bastion_host'

      - name: Revoke Runner IP & Cleanup (Always Runs)
        if: always()
        run: |
          # Remove the temporary IP permission from AWS
          GITHUB_IP=${{ steps.whitelist.outputs.runner_ip }}
          if [ ! -z "$GITHUB_IP" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id ${{ secrets.BASTION_SG_ID }} \
              --protocol tcp --port 22 --cidr ${GITHUB_IP}/32
          fi
          # Delete sensitive files
          rm -f .vault_pass id_rsa
          echo "Cleanup complete."