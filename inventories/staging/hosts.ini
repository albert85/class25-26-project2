# Define the host and its specific connection info
bastion ansible_host="{{ lookup('env', 'BASTION_IP') }}"

# Create a group named 'bastion' and put the host inside it
[bastion]
bastion

[app_servers]
app_node ansible_host="{{ lookup('env', 'APP_IP') }}"

[app_servers:vars]
# Use the actual variable name here; shell-style ${VAR} usually won't 
# work inside the inventory string—use the Jinja2 hostvars instead.
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -q ec2-user@{{ hostvars["bastion"]["ansible_host"] }}"'

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=./id_rsa