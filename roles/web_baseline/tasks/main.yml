---
# 1. Package Installation (Ubuntu/Debian standard)
- name: Install security-essential and python packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, chrony, unattended-upgrades, python3-pip, python3-venv, nginx]
    state: present
    update_cache: yes
    cache_valid_time: 3600

# 2. Firewall and System Hardening
- name: Configure UFW Firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['22', '80', '443']

- name: Enable Firewall
  community.general.ufw:
    state: enabled
    policy: deny

- name: Ensure AWS Time Sync is configured
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    line: "server 169.254.169.123 prefer iburst"
    state: present
  notify: restart_chrony

# 3. Project Directory and Code Sync
- name: Ensure project directory exists
  ansible.builtin.file:
    path: /home/ec2-user/class25-26-project2
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Sync application code to server
  ansible.builtin.copy:
    src: ./ 
    dest: /home/ec2-user/class25-26-project2/
    owner: ec2-user
    group: ec2-user
    # Avoid copying local .venv or __pycache__ if they exist
    exclude: [ '.venv', '__pycache__', '.git' ]

# 4. Virtual Environment & Dependencies
- name: Create Python Virtual Environment and install requirements
  ansible.builtin.pip:
    requirements: "/home/ec2-user/class25-26-project2/requirements.txt"
    virtualenv: "/home/ec2-user/class25-26-project2/.venv"
    virtualenv_command: python3 -m venv
  become: yes
  become_user: ec2-user

# 5. FastAPI Service Deployment
- name: Copy FastAPI systemd service file
  ansible.builtin.template:
    src: project.service.j2
    dest: /etc/systemd/system/fastapi.service
    mode: '0644'
  notify: Restart FastAPI

# 6. Nginx Configuration (Ubuntu Sites-Available Pattern)

- name: Copy Nginx configuration to sites-available
  ansible.builtin.template:
    src: nginx_fastapi.conf.j2
    dest: /etc/nginx/sites-available/fastapi
    mode: '0644'
  notify: Reload Nginx

- name: Enable Nginx site via symbolic link
  ansible.builtin.file:
    src: /etc/nginx/sites-available/fastapi
    dest: /etc/nginx/sites-enabled/fastapi
    state: link

- name: Remove default Nginx site to prevent conflicts
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

# 7. Service Start and Verification
- name: Ensure FastAPI and Nginx are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop: [fastapi, nginx]