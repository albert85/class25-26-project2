---
# Step 1: Connectivity Check
- name: Connectivity Check
  hosts: bastion
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60

# Step 2: Prepare packages on Bastion
- name: Prepare packages on bastion
  hosts: bastion
  become: yes
  tasks:
    - name: Clean up old failed runs and DNF cache
      ansible.builtin.shell: |
        rm -rf /tmp/offline-packages /tmp/project /tmp/bundle.tar.gz
        dnf clean all
      args:
        warn: false

    - name: Install git and dnf utilities
      ansible.builtin.dnf:
        name: 
          - git
          - dnf-utils
          - tar
        state: present

    - name: Ensure package directory exists
      ansible.builtin.file:
        path: /tmp/offline-packages
        state: directory
        mode: '0755'

    - name: Download nginx and dependencies
      ansible.builtin.dnf:
        name: nginx
        state: latest
        download_only: yes
        download_dir: /tmp/offline-packages

    - name: Clone project repository
      ansible.builtin.git:
        repo: https://github.com/albert85/class25-26-project2.git
        dest: /tmp/project
        force: yes

# Step 3: Transfer files from Bastion to App Servers
# Step 3: Transfer files from Bastion to App Servers
# Step 3: Bundle and Transfer (Bastion -> Runner -> App Node)
- name: Transfer packages to private servers
  hosts: app_servers
  become: yes
  gather_facts: no 
  tasks:
    # 1. Zip everything on the Bastion into one file
    - name: Archive packages and project on Bastion
      community.general.archive:
        path: 
          - /tmp/offline-packages
          - /tmp/project
        dest: /tmp/bundle.tar.gz
        format: gz
      delegate_to: bastion_node
      run_once: true

    # 2. Pull the SINGLE zip file from Bastion to the GitHub Runner
    - name: Fetch bundle to GitHub Runner
      ansible.builtin.fetch:
        src: /tmp/bundle.tar.gz
        dest: /tmp/bundle.tar.gz
        flat: yes
      delegate_to: bastion_node
      run_once: true

    # 3. Push the SINGLE zip file from Runner to the App Node
    - name: Push bundle to App Node
      ansible.builtin.copy:
        src: /tmp/bundle.tar.gz
        dest: /tmp/bundle.tar.gz
      # This uses the ProxyJump in your hosts.ini automatically

    # 4. Unpack everything on the App Node
    - name: Unarchive bundle on App Node
      ansible.builtin.unarchive:
        src: /tmp/bundle.tar.gz
        dest: /tmp/
        remote_src: yes
      become: yes

# Step 4: Install Nginx offline on Private Servers
- name: Install nginx offline
  hosts: app_servers
  become: yes
  gather_facts: no
  tasks:
    - name: Install nginx from local packages
      ansible.builtin.shell: |
        dnf install -y /tmp/offline-packages/*.rpm

# Step 5: Deploy FastAPI App
- name: Deploy FastAPI
  hosts: app_servers
  become: yes
  roles:
    - role: app_deploy