---
- name: reload_firewall
  ansible.builtin.service:
    name: firewalld
    state: reloaded

- name: restart_chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart FastAPI
  ansible.builtin.systemd:
    name: fastapi
    state: restarted
    daemon_reload: yes

- name: Reload Nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded