---
# 1. Package Installation
- name: Install security-essential and python packages
  ansible.builtin.dnf:
    name: 
      - chrony
      - firewalld
      - fail2ban
    state: present
    update_cache: yes

# 2. Security Hardening: Firewall
- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: yes

- name: Allow SSH, HTTP, and HTTPS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: yes
    state: enabled
  loop: [ssh, http, https]
  notify: reload_firewall

# 3. Security Hardening: Time Sync & Fail2Ban
- name: Configure AWS Time Sync
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    line: "server 169.254.169.123 prefer iburst"
    state: present
  notify: restart_chrony

- name: Ensure Fail2Ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes