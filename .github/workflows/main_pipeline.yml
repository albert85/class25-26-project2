name: CIS Hardening & FastAPI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security_scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with: { languages: 'python' }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Scan Dependencies (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'

  deploy_ansible:
    needs: security_scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      
      - name: Cache Ansible Roles
        uses: actions/cache@v3
        with:
          path: ~/.ansible/roles
          key: ${{ runner.os }}-ansible-roles-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible & Dependencies
        run: |
          pip install ansible boto3 botocore
          [ -f requirements.yml ] && ansible-galaxy install -r requirements.yml --force || echo "No requirements.yml found"
      
      - name: Run Ansible Playbook (Jump Host Tunnel)
        env:
          BASTION_IP: ${{ secrets.BASTION_IP }}
          APP_IP: ${{ secrets.APP_SERVERS_IP }}
          # We define the arguments here, but ensure they point to the correct path
          ANSIBLE_SSH_COMMON_ARGS: "-o ProxyCommand='ssh -i id_rsa -W %h:%p -q -o StrictHostKeyChecking=no ec2-user@${{ secrets.BASTION_IP }}' -o StrictHostKeyChecking=no"
        run: |
          # 1. Create the necessary files
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > id_rsa
          chmod 600 id_rsa
          
          # 2. Execute the playbook
          # We pass the env variable into the extra-vars using single quotes to preserve the internal spaces
          ansible-playbook -i inventories/staging/hosts.ini site.yml \
            --vault-password-file .vault_pass \
            --private-key id_rsa \
            -u ec2-user \
            --extra-vars "ansible_ssh_common_args='$ANSIBLE_SSH_COMMON_ARGS' 
                          BASTION_IP=${{ secrets.BASTION_IP }} 
                          APP_IP=${{ secrets.APP_SERVERS_IP }} 
                          server_name=${{ secrets.SERVER_NAME }} 
                          app_servers_IP=${{ secrets.APP_SERVERS_IP }}"

      # - name: Verify Deployment (Smoke Test)
      #   run: |
      #     echo "Checking connectivity to Bastion endpoint..."
      #     timeout 60s bash -c 'until curl -s --head http://${{ secrets.BASTION_IP }} | grep "200 OK"; do sleep 5; done'

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f .vault_pass id_rsa
          echo "Sensitive files removed."