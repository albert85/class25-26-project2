[bastion]
bastion_host ansible_host="{{ lookup('env', 'BASTION_PUBLIC_IP') }}"

[app_servers]
app_node ansible_host="{{ lookup('env', 'APP_PRIVATE_IP') }}"

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=./id_rsa
# Using the hostname alias 'bastion_host' simplifies the jump
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ./id_rsa -W %h:%p -q ec2-user@{{ BASTION_PUBLIC_IP }}"'