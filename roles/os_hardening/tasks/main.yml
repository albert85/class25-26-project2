---
# 1. Package Installation
- name: Install security-essential and python packages
  ansible.builtin.dnf:
    name: 
      - chrony
      - firewalld
      - fail2ban
    state: present
    update_cache: yes

# 2. Security Hardening: Firewall
- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: yes

- name: Allow SSH, HTTP, and HTTPS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: yes
    state: enabled
  loop: [ssh, http, https]
  notify: reload_firewall

- name: Allow internal VPC traffic (Ensures ALB access)
  ansible.posix.firewalld:
    # This uses the variable passed from GitHub Secrets
    source: "{{ target_vpc_cidr }}"
    zone: trusted
    state: enabled
    permanent: yes
  notify: reload_firewall

- name: Force immediate firewall reload
  ansible.builtin.meta: flush_handlers

# 3. Security Hardening: Time Sync
- name: Configure AWS Time Sync
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    line: "server 169.254.169.123 prefer iburst"
    state: present
  notify: restart_chrony

# 4. Ensure Fail2Ban is running
- name: Create local fail2ban config with VPC whitelist
  ansible.builtin.copy:
    # Use the variable here to prevent Fail2Ban from banning the ALB
    content: |
      [DEFAULT]
      ignorself = true
      ignoreip = 127.0.0.1/8 {{ target_vpc_cidr }}
    dest: /etc/fail2ban/jail.local
    force: yes

- name: Ensure Fail2Ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes

  handlers:
    - name: reload_firewall
      ansible.builtin.service:
        name: firewalld
        state: reloaded
    - name: restart_chrony
      ansible.builtin.service:
        name: chrony
        state: restarted