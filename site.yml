---
# Step 1: Connectivity Check
- name: Connectivity Check
  hosts: bastion
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60

# Step 2: Prepare packages on Bastion (HAS INTERNET)
- name: Prepare packages on bastion
  hosts: bastion
  become: yes
  tasks:
    - name: Install git and dnf utilities
      ansible.builtin.dnf:
        name: 
          - git
          - dnf-utils
        state: present

    - name: Ensure package directory exists
      ansible.builtin.file:
        path: /tmp/offline-packages
        state: directory
        mode: '0755'

    - name: Download nginx and dependencies
      ansible.builtin.dnf:
        name: nginx
        state: latest
        download_only: yes
        download_dir: /tmp/offline-packages

    - name: Clone project repository
      ansible.builtin.git:
        repo: https://github.com/albert85/class25-26-project2.git
        dest: /tmp/project
        force: yes

# Step 3: Transfer files from Bastion to App Servers
- name: Transfer packages to private servers
  hosts: app_servers
  become: yes
  gather_facts: no
  tasks:
    - name: Ensure package directory exists on app_node
      ansible.builtin.file:
        path: /tmp/offline-packages
        state: directory
        mode: '0755'
      # We delegate to bastion because it's already "inside" the network
      delegate_to: bastion_node

    - name: Copy nginx rpms from bastion to app_node
      ansible.posix.synchronize:
        src: /tmp/offline-packages/
        dest: /tmp/offline-packages/
        mode: push
        use_ssh_args: yes
      delegate_to: bastion_node
      vars:
        # We REMOVE the -i ./id_rsa here because the key is in the AGENT
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ForwardAgent=yes"
        # We explicitly tell Ansible NOT to look for the key file for this delegated task
        ansible_ssh_private_key_file: "" 

    - name: Copy project repo from bastion to app_node
      ansible.posix.synchronize:
        src: /tmp/project/
        dest: /tmp/project/
        mode: push
        use_ssh_args: yes
      delegate_to: bastion_node
      vars:
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ForwardAgent=yes"
        ansible_ssh_private_key_file: ""
        
# Step 4: Install Nginx offline on Private Servers
- name: Install nginx offline
  hosts: app_servers
  become: yes
  tasks:
    - name: Install nginx from local packages
      ansible.builtin.shell: |
        dnf install -y /tmp/offline-packages/*.rpm
      args:
        warn: false

# Step 5: Deploy FastAPI App
- name: Deploy FastAPI
  hosts: app_servers
  become: yes
  roles:
    - role: app_deploy

# Optional: Uncomment Steps 6 & 7 once Step 5 is verified working.