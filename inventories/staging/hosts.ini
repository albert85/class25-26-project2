[bastion]
bastion_host ansible_host="{{ lookup('env', 'BASTION_IP') }}"

[app_servers]
app_node ansible_host="{{ lookup('env', 'APP_PRIVATE_IP') }}"

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=./id_rsa
# This tells the jump host to look up the IP assigned to 'bastion_host'
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ./id_rsa -W %h:%p -q ec2-user@{{ hostvars['bastion_host']['ansible_host'] }}"'