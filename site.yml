---
# Step 1: Connectivity Check
- name: Connectivity Check
  hosts: bastion
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60

# Step 2: Prepare packages on Bastion (HAS INTERNET)
- name: Prepare packages on bastion
  hosts: bastion
  become: yes
  tasks:
    - name: Ensure package directory exists
      ansible.builtin.file:
        path: /tmp/offline-packages
        state: directory
        mode: '0755'

    - name: Download nginx and dependencies
      ansible.builtin.command:
        cmd: dnf install nginx --downloadonly --downloaddir=/tmp/offline-packages
      register: download_result
      changed_when: "'already installed' not in download_result.stdout"

    - name: Clone project repository
      ansible.builtin.git:
        repo: https://github.com/albert85/class25-26-project2.git
        dest: /tmp/project
        force: yes

# Step 3: Transfer files from Bastion to App Servers
- name: Transfer packages to private servers
  hosts: app_servers
  become: yes
  tasks:
    - name: Ensure package directory exists
      ansible.builtin.file:
        path: /tmp/offline-packages
        state: directory
        mode: '0755'

    - name: Copy nginx rpms from bastion
      ansible.posix.synchronize:
        src: /tmp/offline-packages/
        dest: /tmp/offline-packages/
        mode: push  # Changed to push as we are pushing from Bastion to App
        use_ssh_args: yes  # IMPORTANT: Use the Agent Forwarding from the Runner
      delegate_to: bastion

    - name: Copy project repo from bastion
      ansible.posix.synchronize:
        src: /tmp/project/
        dest: /var/www/project/
        mode: push
        use_ssh_args: yes # IMPORTANT: Use the Agent Forwarding from the Runner
      delegate_to: bastion

# Step 4: Install Nginx offline on Private Servers
- name: Install nginx offline
  hosts: app_servers
  become: yes
  tasks:
    - name: Install nginx from local packages
      ansible.builtin.shell: |
        dnf install -y /tmp/offline-packages/*.rpm

# Step 5: Deploy FastAPI App
- name: Deploy FastAPI
  hosts: app_servers
  become: yes
  roles:
    - role: app_deploy

# Step 6: Hardening Bastion
- name: Hardening Bastion server
  hosts: bastion
  become: yes
  ignore_errors: yes
  pre_tasks:
    - name: Ensure DNF configuration directory exists
      ansible.builtin.file:
        path: /etc/dnf
        state: directory
        mode: '0755'

    - name: Pre-configure DNF for CIS compliance
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
        state: present
      loop:
        - { regexp: '^gpgcheck=', line: 'gpgcheck=1' }
        - { regexp: '^localpkg_gpgcheck=', line: 'localpkg_gpgcheck=1' }

  vars:
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_section1_patch_management: false
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false
    rhel9cis_setup_audit: true

  roles:
    - role: os_hardening
    - role: ssh_hardening
    - role: rhel9-cis

# Step 7: Hardening Application Servers
- name: OS Hardening Application servers
  hosts: app_servers
  become: yes
  ignore_errors: yes
  vars:
    firewall_allow_sources: ["{{ target_vpc_cidr }}"]
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_section1_patch_management: false
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false

  roles:
    - role: os_hardening
    - role: ssh_hardening
    - role: rhel9-cis

  post_tasks:
    - name: Allow Nginx to proxy to FastAPI
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes

    - name: Allow port 8000 for HTTP
      community.general.seport:
        ports: 8000
        proto: tcp
        setype: http_port_t
        state: present

    - name: Trust VPC CIDR
      ansible.posix.firewalld:
        source: "{{ target_vpc_cidr }}"
        zone: trusted
        state: enabled
        permanent: yes
        immediate: yes

    - name: Allow HTTP
      ansible.posix.firewalld:
        service: http
        zone: public
        state: enabled
        permanent: yes
        immediate: yes

    - name: Configure Fail2Ban ignore list
      ansible.builtin.lineinfile:
        path: /etc/fail2ban/jail.local
        regexp: '^ignoreip ='
        line: "ignoreip = 127.0.0.1/8 {{ target_vpc_cidr }}"
        create: yes
      notify: restart_fail2ban

    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

  handlers:
    - name: restart_fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted