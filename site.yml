---
# Step 1: Connectivity Check
- name: Connectivity Check
  hosts: bastion
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60

# Step 2: Prepare packages on Bastion
- name: Prepare packages on bastion
  hosts: bastion
  become: yes
  tasks:
    - name: Clean up old failed runs and DNF cache
      ansible.builtin.shell: |
        rm -rf /tmp/offline-packages /tmp/project /tmp/bundle.tar.gz
        dnf clean all
        journalctl --vacuum-time=1d || true
      args:
        executable: /bin/bash

    - name: Install base utilities and Python/Pip
      ansible.builtin.dnf:
        name: 
          - git
          - dnf-utils
          - tar
          - python3
          - python3-pip
          - python3-devel
        state: present

    - name: Ensure package directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /tmp/offline-packages
        - /tmp/offline-packages/python-wheels

    - name: Clone project repository
      ansible.builtin.git:
        repo: https://github.com/albert85/class25-26-project2.git
        dest: /tmp/project
        force: yes

    - name: Download Pip dependencies (Wheels)
      ansible.builtin.shell: |
        # Use python3 -m pip to ensure the correct path is used
        python3 -m pip download -r /tmp/project/requirements.txt -d /tmp/offline-packages/python-wheels
      args:
        executable: /bin/bash

    - name: Download Nginx and Python RPMs for App Node
      ansible.builtin.dnf:
        name: 
          - nginx
          - python3
          - python3-pip
          - python3-devel
          - chrony
          - firewalld
          - ipset                  # Required by firewalld
          - python3-firewall       # Required for ansible.posix.firewalld to work
          - fail2ban
          - policycoreutils-python-utils # Required for SELinux tasks
          - tar
        state: latest
        download_only: yes
        download_dir: /tmp/offline-packages
    

# Step 3: Bundle and Transfer (Bastion -> Runner -> App Node)
- name: Transfer packages to private servers
  hosts: app_servers
  become: yes
  gather_facts: no 
  tasks:
    - name: Archive packages and project on Bastion
      community.general.archive:
        path: 
          - /tmp/offline-packages
          - /tmp/project
        dest: /tmp/bundle.tar.gz
        format: gz
      delegate_to: bastion_node
      run_once: true

    - name: Fetch bundle to GitHub Runner
      ansible.builtin.fetch:
        src: /tmp/bundle.tar.gz
        dest: /tmp/bundle.tar.gz
        flat: yes
      delegate_to: bastion_node
      run_once: true

    - name: Push bundle to App Node
      ansible.builtin.copy:
        src: /tmp/bundle.tar.gz
        dest: /tmp/bundle.tar.gz
      become: yes

    - name: Unarchive bundle on App Node
      ansible.builtin.unarchive:
        src: /tmp/bundle.tar.gz
        dest: /tmp/
        remote_src: yes
      become: yes

# Step 4: Install Nginx and Python offline on Private Servers
- name: Install nginx and python offline
  hosts: app_servers
  become: yes # Crucial: only root can write to /etc/systemd/system/
  roles:
    - role: nginx_deploy

# Step 5: Deploy FastAPI App
- name: Deploy FastAPI
  hosts: app_servers
  become: yes
  roles:
    - role: app_deploy


# Step 4: Hardening the Bastion
# Step 5: Hardening the App Server (OFFLINE MODE)
- name: OS Hardening Application servers
  hosts: app_servers
  become: yes
  ignore_errors: yes
  
  vars:
    # --- OFFLINE HARDENING FLAGS ---
    # These variables tell the roles "Don't try to use the internet"
    os_hardening_install_auditd: false # We install it manually from our RPMs
    ssh_hardening_manage_packages: false
    rhel9cis_section1_patch_management: false
    rhel9cis_rule_1_2_1: false # Skip subscription manager
    rhel9cis_rule_1_2_2: false # Skip gpgcheck for repos (we are offline)
    
    # Existing vars
    firewall_allow_sources: ["{{ target_vpc_cidr }}"] 
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false

  pre_tasks:
    - name: Pre-install hardening tools from local RPMs
      ansible.builtin.shell: |
        dnf install -y --disablerepo=* /tmp/offline-packages/*.rpm
      # This ensures the tools are already there before the roles run

  roles:
    - role: os_hardening
    - role: ssh_hardening
    - { role: rhel9-cis, ignore_errors: yes }

  post_tasks:
    # --- 1. SELINUX FIX ---
    - name: Allow Nginx to proxy to FastAPI
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes
      # Note: This requires 'policycoreutils-python-utils' which we downloaded in Step 2