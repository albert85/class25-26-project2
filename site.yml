---
# Step 1: Connectivity Check
- name: Connectivity Check
  hosts: bastion
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60

# Step 2: Prepare Master Offline Bundle on Bastion
- name: Prepare packages on bastion
  hosts: bastion
  become: yes
  tasks:
    - name: Clean up old failed runs and DNF cache
      ansible.builtin.shell: |
        rm -rf /tmp/offline-packages /tmp/project /tmp/bundle.tar.gz
        dnf clean all
      args:
        executable: /bin/bash

    - name: Install base utilities on Bastion
      ansible.builtin.dnf:
        name: [git, dnf-utils, tar, python3, python3-pip]
        state: present

    - name: Ensure package directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /tmp/offline-packages
        - /tmp/offline-packages/python-wheels

    - name: Clone project repository
      ansible.builtin.git:
        repo: https://github.com/albert85/class25-26-project2.git
        dest: /tmp/project
        force: yes

    - name: Download Python Wheels (App Dependencies)
      ansible.builtin.shell: |
        python3 -m pip download -r /tmp/project/requirements.txt -d /tmp/offline-packages/python-wheels
      args:
        executable: /bin/bash

    - name: Download Master RPM List (Nginx, Python, Hardening Tools)
      ansible.builtin.dnf:
        name: 
          - nginx
          - python3
          - python3-pip
          - python3-devel
          - chrony
          - firewalld
          - ipset
          - python3-firewall
          - fail2ban
          - policycoreutils-python-utils
          - tar
          - audit
        state: latest
        download_only: yes
        download_dir: /tmp/offline-packages

# Step 3: Bundle and Transfer (Bastion -> Runner -> App Node)
- name: Transfer packages to private servers
  hosts: app_servers
  become: yes
  gather_facts: no 
  tasks:
    - name: Archive everything on Bastion
      community.general.archive:
        path: [/tmp/offline-packages, /tmp/project]
        dest: /tmp/bundle.tar.gz
        format: gz
      delegate_to: bastion_node
      run_once: true

    - name: Fetch bundle to GitHub Runner
      ansible.builtin.fetch:
        src: /tmp/bundle.tar.gz
        dest: /tmp/bundle.tar.gz
        flat: yes
      delegate_to: bastion_node
      run_once: true

    - name: Push bundle to App Node
      ansible.builtin.copy:
        src: /tmp/bundle.tar.gz
        dest: /tmp/bundle.tar.gz
      become: yes

    - name: Unarchive bundle on App Node
      ansible.builtin.unarchive:
        src: /tmp/bundle.tar.gz
        dest: /tmp/
        remote_src: yes
      become: yes

# Step 4 & 5: Hardening and App Deployment
- name: OS Hardening & FastAPI Deployment
  hosts: app_servers
  become: yes
  vars:
    # --- OFFLINE HARDENING OVERRIDES ---
    os_hardening_install_auditd: false
    os_hardening_manage_python: false
    ssh_hardening_manage_packages: false
    rhel9cis_section1_patch_management: false
    rhel9cis_rule_1_2_1: false
    rhel9cis_rule_1_2_2: false
    rhel9cis_rule_1_2_3: false
    rhel9cis_rule_1_2_4: false
    rhel9cis_rule_6_1_1: false  # This stops the role from trying to install/init AIDE
    rhel9cis_setup_audit: false # Often linked to AIDE; skip to save time
    
    # Existing Vars
    firewall_allow_sources: ["{{ target_vpc_cidr }}"] 
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_skip_for_manual_configuration: true

  pre_tasks:
    - name: Blindfold DNF from internet
      ansible.builtin.shell: |
        mkdir -p /etc/yum.repos.d/backup
        mv /etc/yum.repos.d/*.repo /etc/yum.repos.d/backup/ || true
      args:
        executable: /bin/bash

    - name: Pre-install all RPMs strictly offline
      ansible.builtin.shell: |
        dnf install -y --disablerepo=* /tmp/offline-packages/*.rpm
      register: offline_dnf_result

  roles:
    - {role: os_hardening, ignore_errors: yes }
    - {role: ssh_hardening, ignore_errors: yes }
    - { role: rhel9-cis, ignore_errors: yes }
    - role: app_deploy

  post_tasks:
    - name: Restore DNF repositories
      ansible.builtin.shell: mv /etc/yum.repos.d/backup/*.repo /etc/yum.repos.d/ || true
      ignore_errors: yes

    - name: Final SELinux Fixes
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes