[bastion]
bastion_host ansible_host="{{ lookup('env', 'BASTION_IP') }}"

[app_servers]
app_node ansible_host="{{ lookup('env', 'APP_IP') }}"

[app_servers:vars]
# Only app_servers will use the ProxyCommand
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ./id_rsa -W %h:%p -q ec2-user@{{ lookup('env', 'BASTION_IP') }}"'

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=./id_rsa
# The bastion only needs this (it connects directly)
ansible_ssh_extra_args='-o StrictHostKeyChecking=no'