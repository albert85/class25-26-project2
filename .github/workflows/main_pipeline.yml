  deploy_ansible:
    # needs: security_scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      
      - name: Cache Ansible Roles
        uses: actions/cache@v3
        with:
          path: ~/.ansible/roles
          key: ${{ runner.os }}-ansible-roles-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible & Dependencies
        run: |
          pip install ansible boto3 botocore
          [ -f requirements.yml ] && ansible-galaxy install -r requirements.yml --force || echo "No requirements.yml found"
      
      - name: Run Ansible Playbook (Jump Host Agent Forwarding)
        env:
          BASTION_IP: ${{ secrets.BASTION_IP }}
          APP_IP: ${{ secrets.APP_SERVERS_IP }}
          VPC_CIDR: ${{ secrets.VPC_CIDR_BLOCK }}
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > id_rsa
          chmod 600 id_rsa
          
          # 1. Start SSH Agent and add the key
          eval $(ssh-agent -s)
          ssh-add id_rsa
          
          # 2. Run Playbook with ForwardAgent=yes
          # This allows the 'rsync' task on the Bastion to use the key in the Runner's agent
          ansible-playbook -i inventories/staging/hosts.ini site.yml \
          --vault-password-file .vault_pass \
          -u ec2-user \
          --extra-vars "target_vpc_cidr=${{ secrets.VPC_CIDR_BLOCK }} \
                BASTION_IP=${{ secrets.BASTION_IP }} \
                server_name=${{ secrets.SERVER_NAME }} \
                APP_IP=${{ secrets.APP_SERVERS_IP }}"
                         

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f .vault_pass id_rsa
          echo "Sensitive files removed."