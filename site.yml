---
# Step 1: Connectivity Check
- name: Connectivity Check
  hosts: all
  gather_facts: no
  tasks:
    - name: Wait for SSH to respond
      ansible.builtin.wait_for_connection:
        timeout: 60

# Step 2: Setup Web Entry Point
- name: Deploy Nginx
  hosts: app_servers
  become: yes
  roles:
    - role: nginx_deploy

# Step 3: Setup Internal App
- name: Deploy FastAPI
  hosts: app_servers
  become: yes
  roles:
    - role: app_deploy

# Step 4: Hardening the Bastion
- name: Hardening Bastion server
  hosts: bastion
  become: yes
  ignore_errors: yes
  pre_tasks:
    - name: Ensure DNF configuration directory exists
      ansible.builtin.file:
        path: /etc/dnf
        state: directory
        mode: '0755'
    - name: Pre-configure DNF for CIS compliance
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
        state: present
        mode: '0644'
      loop:
        - { regexp: '^gpgcheck=', line: 'gpgcheck=1' }
        - { regexp: '^localpkg_gpgcheck=', line: 'localpkg_gpgcheck=1' }
  vars:
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_section1_patch_management: false  
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false
    rhel9cis_setup_audit: true
  roles:
    - role: os_hardening      
    - role: ssh_hardening     
    - { role: rhel9-cis, ignore_errors: yes }

# Step 5: Hardening the App Server
- name: OS Hardening Application servers
  hosts: app_servers
  become: yes
  ignore_errors: yes
  
  vars:
    firewall_allow_sources: ["{{ target_vpc_cidr }}"] 
    ntp_config_file: /etc/chrony.conf
    os_security_kernel_enable_ntp: false
    rhel9cis_section1_patch_management: false
    rhel9cis_rule_1_2_3: false
    rhel9cis_skip_for_manual_configuration: true
    rhel9cis_bootloader_password: false

  roles:
    - role: os_hardening
    - role: ssh_hardening
    - { role: rhel9-cis, ignore_errors: yes }

  post_tasks:
    # --- 1. SELINUX FIX (THE 502 KILLER) ---
    - name: Allow Nginx to proxy to FastAPI (Fixes 502 Bad Gateway)
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes

    - name: Ensure SELinux allows Port 8000 for HTTP traffic
      community.general.seport:
        ports: 8000
        proto: tcp
        setype: http_port_t
        state: present

    # --- 2. FIREWALLD FIXES ---
    - name: Ensure firewalld trusts the VPC (ALB Health Checks)
      ansible.posix.firewalld:
        source: "{{ target_vpc_cidr }}"
        zone: trusted
        state: enabled
        permanent: yes
        immediate: yes

    - name: Explicitly allow HTTP port 80 in public zone
      ansible.posix.firewalld:
        service: http
        zone: public
        state: enabled
        permanent: yes
        immediate: yes

    # --- 3. FAIL2BAN FIX ---
    - name: Configure Fail2Ban to ignore VPC (ALB IPs)
      ansible.builtin.lineinfile:
        path: /etc/fail2ban/jail.local
        regexp: '^ignoreip ='
        line: "ignoreip = 127.0.0.1/8 {{ target_vpc_cidr }}"
        create: yes
      notify: restart_fail2ban

    - name: Restart Nginx to pick up environment changes
      ansible.builtin.service:
        name: nginx
        state: restarted

  handlers:
    - name: restart_fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted