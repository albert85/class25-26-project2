---
# 1. Package Installation
# 1. Package Installation (Offline)
- name: Install python packages from local RPMs
  ansible.builtin.shell: |
    dnf install -y --disablerepo=* /tmp/offline-packages/*.rpm
  become: yes

# # 4. Direct Code Sync
